[project]
name = "plain-language-bench"
version = "0.1.0"
description = "What gets lost when a government letter is rewritten in plain language: a benchmark, and a rewrite tool that checks every deadline, amount and right survives"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plainbench = "plainbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "textstat==0.7.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plainbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
